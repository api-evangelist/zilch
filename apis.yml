name: Zilch
kind: company
description: >-
  Zilch is a London-headquartered "buy now, pay later" and ad-subsidised
  payments network founded in 2018, and one of the United Kingdom's most
  prominent BNPL brands. Rather than integrating at each retailer's checkout,
  Zilch is deliberately merchant-agnostic: consumers apply in the Zilch mobile
  app, receive a virtual (and physical) Mastercard, and can Pay-in-3, pay over
  six weeks, or Pay-now-and-earn-cashback anywhere Mastercard is accepted,
  online or in-store, through Apple Pay and Google Pay wallets. Because Zilch
  reaches merchants over the open Mastercard card rails and relies on partners
  such as Mastercard for card issuing and Checkout.com as its payments
  processor, it does not operate a public merchant-integration or developer
  platform the way a PSP or open-banking provider does. As of this review Zilch
  publishes no developer portal, no API reference, and no downloadable
  OpenAPI/Swagger specification; its public surface is a consumer marketing
  site, a help centre, and a customer sign-up/login app. This profile therefore
  records Zilch's verified public web properties honestly and carries no API
  entries, because none are publicly documented.
